[project]
name = "stride"
version = "1.0.0"
description = "STRIDE: Stride-level Tracking and Integrated Decision Extraction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Yipeng Li"},
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "numpy>=1.24",
    "opencv-python>=4.8,<4.14",   # 4.14 changed the ChArUco detector: the same board reads ~0.1 % lower
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
    "shapely>=2.0",
    "sleap-io>=0.5.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
stride = "stride.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `pytest` runs the public tests; the lab tests are collected too once the lab layer is installed (pip install -e lab/)
testpaths = ["tests", "lab/tests"]
