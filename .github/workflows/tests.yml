name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"          # UTF-8 for text I/O and the console on every runner
      MPLBACKEND: Agg          # no display on the runners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            lab/pyproject.toml

      - name: Install STRIDE (public package + test tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Public tests (synthetic data; no videos, models or GPU)
        run: python -m pytest tests -q

      - name: Install the lab layer
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install -e lab/

      - name: Lab tests
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest lab/tests -q
